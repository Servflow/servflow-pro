    onTrue: action.id_c5de23f72a5a41b4909de8f1f7f5b422
    onFalse: response.id_9c6b47d123db4b898f3d2eabc7f209a0
    expression: ""
    structure:
      - - content: body "action"
          comparison: '"opened"'
          function: eq
          title: ""
      - - content: body "action"
          comparison: '"synchronize"'
          function: eq
          title: ""
      - - content: body "action"
          comparison: '"reopened"'
          function: eq
          title: ""
  id_bfeb651b587747b9a5f01e849c597c10:
