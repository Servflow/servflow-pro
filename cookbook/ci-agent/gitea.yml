enabled: true
schedule:
  enabled: false
  cron: ""
  next: ""
id: gitea_review_webhook
actions:
  handle_webhook:
    name: extract info
    type: javascript
    config:
      script: |
        // Extract commit, repository, PR, etc. from a Gitea webhook payload.
        function servflowRun(vars,request_body) {
          const body = JSON.parse(request_body);
          // For push event
          if (body.after && body.repository) {
            return {
              repo: body.repository.full_name,
              repo_name: body.repository.name,
              owner: body.repository.owner && body.repository.owner.name,
              commit: body.after,
              ref: body.ref,
              pr_number: null,
              event_type: "push"
            };
          }
          // For PR event
          else if (body.pull_request && body.repository) {
            return {
              repo: body.repository.full_name,
              repo_name: body.repository.name,
              owner: body.repository.owner && body.repository.owner.name,
              commit: body.pull_request.merge_commit_sha || body.pull_request.head.sha,
              pr_number: body.pull_request.number,
              ref: body.pull_request.head.ref,
              event_type: "pull_request"
            };
          }
          throw new Error("Unsupported or unknown webhook payload");
        }
    next: response.success
    fail: response.error
    dispatch:
      - conditional.id_25c71d5fb8944c5e87db23301ef86037
  id_0ded133b46af40bbb0fcacb4e64448bc:
    name: Edit Overview
    type: http
    config:
      body:
        body: "{{ escape .id_1dc982b7bb364fafb31c96f5afb15d42 }}"
      expectedResponseCode: "200"
      headers:
        Authorization: token {{ secret "<< .SecretName >>" }}
        Content-Type: application/json
      method: PATCH
      responsePath: ""
      url: << .GiteaURL >>/api/v1/repos/<< .Repository >>/issues/{{.handle_webhook.pr_number }}/comments/{{ .id_da2400b631f241f2b6dd67fdc1c0bcf1 }}
    next: ""
    fail: ""
  id_1dc982b7bb364fafb31c96f5afb15d42:
    name: AI Agent
    type: agent
    config:
      integrationID: openai-main
      systemPrompt: "You are part of a ci review Pipeline for a repository. Taking the input diff attached below. Generate a shell script or command that will minimally read the necessary source files in << .ProjectPath >> to get more context to enable proper review of these diffs, use the tool to run the script. And give an overview of concerns regarding these changes.\n\nIn the overview, give any concerns and notes. Then reference files using the url\n\n<< .GiteaURL >>/<< .Repository >>/src/commit/{{ .handle_webhook.commit }}/<relative/path/tofile>\n\nUse the available acion to drop  comments on specific lines and files\n\nIgnore any changes in the subrepos, only the main repo is being reviewed. \n\n\nDiffs below:\n{{ escape .run_analysis }}"
      toolConfigs:
        - mcpConfig:
            endpoint: ""
            headers: {}
            toolsList: []
          type: workflow
          workflowConfig:
            description: This tool is for running a single shell script and returns the output (escaped)
            name: run_shell
            params:
              - script
            returnFile:
              identifier: ""
              type: ""
            returnValue: "{{ .id_6655f25401d94b1f8b87c4eae7a00249 }}"
            start: action.id_6655f25401d94b1f8b87c4eae7a00249
            type: string
        - mcpConfig:
            endpoint: ""
            headers: {}
            toolsList: []
          type: workflow
          workflowConfig:
            description: This tool drops a comment on a specific file and line number. The line number is the line on the new version of the code
            name: comment_file
            params:
              - body
              - file_path
              - line_number
            returnFile:
              identifier: ""
              type: ""
            returnValue: ""
            start: action.id_e11db799ff054d0f8c61fe9cae8a5ce0
            type: string
    next: action.id_da2400b631f241f2b6dd67fdc1c0bcf1
    fail: ""
  id_90e9b762777b4991a2573cfa43893bc4:
    name: Store Key
    type: store_key
    config:
      key: pr_{{ .handle_webhook.pr_number }}
      value: "{{ .post_comment }}"
    next: ""
    fail: ""
  id_6655f25401d94b1f8b87c4eae7a00249:
    name: Read files
    type: shell
    config:
      script: '{{ tool_param "script" }}'
    next: ""
    fail: ""
  id_da2400b631f241f2b6dd67fdc1c0bcf1:
    name: Get Key
    type: get_key
    config:
      failIfEmpty: true
      key: pr_{{ .handle_webhook.pr_number }}
    next: action.id_0ded133b46af40bbb0fcacb4e64448bc
    fail: action.post_comment
  post_comment:
    name: Send overview
    type: http
    config:
      body:
        body: "{{ escape .id_1dc982b7bb364fafb31c96f5afb15d42 }}"
      expectedResponseCode: "201"
      headers:
        Authorization: token {{ secret "<< .SecretName >>" }}
        Content-Type: application/json
      method: POST
      responsePath: id
      url: << .GiteaURL >>/api/v1/repos/<< .Repository >>/issues/{{.handle_webhook.pr_number }}/comments
    next: action.id_90e9b762777b4991a2573cfa43893bc4
    fail: response.error
  run_analysis:
    name: Set up repo
    type: shell
    config:
      command: |
        if [ "{{ .handle_webhook.event_type }}" = "push" ]; then
          git fetch origin {{ .handle_webhook.ref }};
          git diff {{ .handle_webhook.commit }}^ {{ .handle_webhook.commit }};
        else
          git fetch origin pull/{{ .handle_webhook.pr_number }}/head:pr_{{ .handle_webhook.pr_number }};
          git diff origin/main...pr_{{ .handle_webhook.pr_number }};
        fi
      script: |
        cd << .ProjectPath >>
        if [ "{{ .handle_webhook.event_type }}" = "push" ]; then
          git fetch origin {{ .handle_webhook.ref }};
          git diff {{ .handle_webhook.commit }}^ {{ .handle_webhook.commit }};
        else
          git fetch origin pull/{{ .handle_webhook.pr_number }}/head:pr_{{ .handle_webhook.pr_number }};
          git checkout pr_{{ .handle_webhook.pr_number }}
          git diff origin/main...pr_{{ .handle_webhook.pr_number }};
        fi
      shell: sh
    next: action.id_1dc982b7bb364fafb31c96f5afb15d42
    fail: response.error
conditionals:
  id_25c71d5fb8944c5e87db23301ef86037:
    name: is pull request
    onTrue: action.run_analysis
    onFalse: response.id_497870e54ee44cfa955568c739374c8e
    expression: ""
    structure:
      - - content: .handle_webhook.event_type
          comparison: '"pull_request"'
          function: eq
          title: ""
responses:
  error:
    name: error
    code: 500
    template: ""
    type: ""
    responseObject:
      value: ""
      fields:
        error:
          value: "{{ .error }}"
          fields: {}
        success:
          value: "false"
          fields: {}
    file:
      type: ""
      identifier: ""
  id_497870e54ee44cfa955568c739374c8e:
    name: not pull request
    code: 400
    template: ""
    type: ""
    responseObject:
      value: ""
      fields: {}
    file:
      type: ""
      identifier: ""
  success:
    name: success
    code: 200
    template: ""
    type: ""
    responseObject:
      value: ""
      fields:
        gitea_response:
          value: "{{ .post_comment }}"
          fields: {}
        message:
          value: Gitea comment posted
          fields: {}
        success:
          value: "true"
          fields: {}
    file:
      type: ""
      identifier: ""
http:
  listenPath: << .ListenPath >>
  method: POST
  next: action.handle_webhook
  corsAllowedOrigins: []
mcpTool:
  enabled: false
  name: ""
  description: ""
  args: {}
  result: ""
  start: ""
integrations: {}
