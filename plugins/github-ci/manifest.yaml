slug: github-ci
name: GitHub PR Reviewer
version: 4.0.0
description: AI-powered pull request reviewer and responder for GitHub
entry: main.ts

# This plugin configures an already-created agent. Create the agent in the
# dashboard first, then install this plugin against it: it stores the GitHub App
# credentials, builds the four review workflows, and attaches them to the agent.
# No workspace is needed — the bot is HTTP-only (it reviews the PR diff and
# conversation via the GitHub API and never clones the repo).
#
# It works with an already-created GitHub App too. Create the App on GitHub with
# pull_requests:read/write, issues:read/write, contents:read, metadata:read and
# the "Pull request" + "Issue comment" webhook events, point its webhook at
# <your-host><webhookPath>, then supply the App's credentials below.
#
# What gets installed (all prefixed with instanceName):
#   <instance>-webhook        HTTP entrypoint. Webhook signatures are verified by
#                             the host's `github_webhook` entry handler BEFORE the
#                             workflow runs; requires a ServFlow Pro build that
#                             ships that handler.
#   <instance>-review         Posts an upserted "PR Overview" comment + a grouped
#                             review with inline comments on PR open/synchronize.
#   <instance>-respond        Replies when a PR comment mentions @servflow.
#   <instance>-fetch-context  Shared diff/metadata/conversation fetcher.
#
# agentId is NOT declared here: the installer creates/selects the agent up front
# and injects it as install context, so the plugin reads it from
# installer.inputs() without prompting for it.
fields:
  - name: appId
    label: GitHub App ID
    description: Numeric App ID of your GitHub App (used as the JWT issuer)
    type: text
    required: true

  - name: privateKey
    label: Private Key (PEM)
    description: >-
      The GitHub App private key .pem file. The host reads its contents and stores
      them as an encrypted secret; the contents are never exposed to the plugin.
    type: file
    required: true

  - name: webhookSecret
    label: Webhook Secret
    description: The webhook secret configured on the GitHub App
    type: password
    required: true

  - name: webhookPath
    label: Webhook Path
    description: Path the GitHub App webhook is configured to POST to
    type: text
    required: true
    default: /webhooks/github-ci

  - name: instanceName
    label: Instance Name
    description: >-
      Prefix for the secrets and workflow ids this install creates. Change it to
      run more than one PR reviewer without name collisions.
    type: text
    required: true
    default: github-ci

# Integrations this plugin needs in order to run. Unlike a field, an integration
# is a first-class resource: the caller (CLI/UI) picks an existing AI integration
# or creates one before the plugin runs, then passes its id in. The plugin reads
# the resolved id via installer.integrations() and drops it into the review
# workflows' agent actions — it never collects the AI credentials itself.
integrations:
  - key: ai
    label: AI Integration
    description: The AI integration the review and responder agents use.
    group: ai
    required: true
