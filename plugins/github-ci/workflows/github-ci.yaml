  id_b88058262e71486085c64bd2f3a9d8a2:
    name: SubAgent
    type: agent
    config:
      integrationID: << .IntegrationID >>
      returnLastMessage: true
      systemPrompt: "You are a sub-agent in a CI review workflow. Your job is to validate and, if necessary, correct the file line number for GitHub PR comment_file actions. \n\nGiven:\n- The user's intended (old) line number.\n- The unified git diff of the file.\n- The file name (path).\n- The intended comment content.\n- The commit SHA.\n\nYour task:\n- Confirm if the intended line number is a valid line on the *right side* (post-change) of the diff.\n- If that line number is invalid (e.g., it falls into a deleted/unchanged section or points to an old line that's moved), recalculate the correct right-side (new) line in the diff that matches the original intent as closely as possible.\n- Output ONLY the new, valid right-side line number for the comment (as an integer). If the input line is already correct, return it unchanged (as integer).\n\nRequired output:\n- Just the mapped line number (integer), nothing else.\n\nExtra Guidance:\n- Account for diff hunks, added/deleted lines, and all necessary diff noise.\n- If you are uncertain and cannot resolve a line, output -1.\n\nExample:\n- If intended line is 20, but that is now at line 22 in the new file per the diff, output 22.\n- If intended line is 20 and is still at line 20 in the new file, output 20.\n- If line 20 was deleted in the patch, output -1.\n\nInput fields:\n- diff: unified diff text for the file\n- old_line: user's original line number (integer)\n- file: file path (string)\n- comment: intended comment content (string)\n- commit_id: commit SHA (string)\n\nNever output anything but the correct right-side line number (or -1).\n"
      userPrompt: |
        Task:
        Given this diff:
        {{ escape .id_4a806a7450194f50b1111162bc601d0c }}

        The user's intended line: {{ tool_param "line" }}
        File: {{ tool_param "file" }}
        Comment: {{ tool_param "comment" }}

        Validate and correct the line number for a PR code review comment so that it points to the correct right-hand line per the diff.

        Output ONLY the new line number for the right-side file, or -1 if invalid.
    next: conditional.id_168c7c297ef64b48a1f0adb16260795a
    fail: ""
  id_c1ac93bd7d534619b69fabf785979bf2:
    name: execute Command
    type: shell
    config:
      command: cd {{ .id_c5de23f72a5a41b4909de8f1f7f5b422.task_id }} && {{ tool_param "command" }}
      script: cd {{ .id_c5de23f72a5a41b4909de8f1f7f5b422.task_id }} && {{ tool_param "command" }}
    next: ""
    fail: ""
  id_c5de23f72a5a41b4909de8f1f7f5b422:
    name: Generate ID
    type: javascript
    config:
      script: |
        function servflowRun(vars) {
          function uuidv4() {
            // Generate a random v4 UUID (RFC4122)
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
              var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
              return v.toString(16);
            });
          }
          return { task_id: uuidv4() };
        }
    next: action.id_4499bbc9bf8946b6b6c9c7551a9bf2f4
    fail: response.id_9c6b47d123db4b898f3d2eabc7f209a0
