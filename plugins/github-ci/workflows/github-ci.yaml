# X-Hub-Signature-256 needs HMAC-SHA256 over the raw request body, which no
# existing action/template func provides (hash=bcrypt only, goja has no crypto,
# and `body ""` re-encodes the bytes). TODO: add a pro-local `github_webhook_verify`
# action and route `http.next` through it before id_291c1247590c40009956dbc40bbec3d7.
